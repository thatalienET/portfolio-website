<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Alex Smith Motion Designer</title>
    <meta name=description content="Alex Smith Motion Designer Portfolio Website">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preload" as="style" href="/style.css">
    <link rel="preload" as="script" href="https://unpkg.com/@rive-app/webgl2@2">
    <link rel="stylesheet" href="/style.css">
    <script src="/shared.js" async></script>
    <script src="https://unpkg.com/@rive-app/webgl2@2"></script>
</head>

<body>
    <h1>Run <code style="background-color: #444; color: orange; padding: 5px">fillRiveCanvas("icons V2")</code> (etc) from the console</h1>
    <canvas id="canvas-1" width="600" height="600" class="rive"></canvas>
    <canvas id="canvas-2" width="600" height="600" class="rive"></canvas>
    <canvas id="canvas-3" width="600" height="600" class="rive"></canvas>
</body>
<script>
  var riveInstaces = [];
  var canvasId = 1;

  function fillRiveCanvas(name, stateMachine, artboard) {
    const canvas = document.getElementById("canvas-" + canvasId);
    const r = new rive.Rive({
      src: "/assets/interactive/" + name + ".riv",
      canvas: canvas,
      stateMachines: stateMachine || decodeURIComponent("State%20Machine%201"),
      autoplay: false,
      onLoad: () => {
        r.resizeDrawingSurfaceToCanvas();
        r.play();
      },
    });
    // canvas.addEventListener("mouseover", () => r.play());
    riveInstaces.push(r);
    canvasId = canvasId + 1;
  }

  window.addEventListener("resize", () => {
    riveInstaces.forEach((r) => {
        r.resizeDrawingSurfaceToCanvas();
    });
  });
</script>
</html>
